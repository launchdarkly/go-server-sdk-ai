name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with the supported-version policy and the `go` directive in go.mod
        # (the base go-server-sdk dependency requires Go 1.24+).
        go-version: ['1.24', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        # v8+ is required for golangci-lint v2 (which the version: "2" config format needs).
        # Pinned so lint behavior doesn't drift between runs; bump deliberately.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
